name: Build iOS IPA From NSP

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'URL de descarga directa del juego (.nsp)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip3 install lz4 "capstone>=5,<6" fonttools
          brew install dotnet-sdk

      - name: Setup Keys
        run: |
          mkdir -p "$HOME/.config/nxnative"
          echo "${{ secrets.PROD_KEYS }}" > "$HOME/.config/nxnative/prod.keys"

      - name: Download and Patch Code
        run: |
          # 1. Descargar el archivo limpio del juego desde tu enlace
          curl -L -o game.nsp "${{ github.event.inputs.game_url }}"
          
          # 2. Forzar la extracción y generación inicial del proyecto de Xcode
          python3 scripts/build_ipa_from_nsp.py game.nsp --allow-other-metal || true
          
          # 3. PARCHE NUCLEAR: Erradicar el Scaler moderno en todo el entorno generado
          find . -type f \( -name "*.m" -o -name "*.h" -o -name "*.mm" -o -name "*.py" \) -exec sed -i '' -E 's/.*(colorContentOffsetX|colorContentOffsetY|MTL4FXTemporalScaler|MTL4FX).*/\/\/ Deshabilitado para Xcode 26.6/g' {} +
          
          # 4. Lanzar la compilación definitiva con los archivos ya capados en local
          python3 scripts/build_ipa_from_nsp.py game.nsp --allow-other-metal
