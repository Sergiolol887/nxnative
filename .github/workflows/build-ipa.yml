name: Build iOS IPA From NSP

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'URL de descarga directa del juego (.nsp)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip3 install lz4 "capstone>=5,<6" fonttools
          brew install dotnet-sdk

      - name: Setup Keys
        run: |
          mkdir -p "$HOME/.config/nxnative"
          echo "${{ secrets.PROD_KEYS }}" > "$HOME/.config/nxnative/prod.keys"

      - name: Download, Patch and Structure Game Folder
        run: |
          # 1. Crear la carpeta específica para el juego dentro del servidor
          mkdir -p game_folder
          
          # 2. Descargar el archivo .nsp directamente dentro de esa nueva carpeta
          curl -L -o game_folder/game.nsp "${{ github.event.inputs.game_url }}"
          
          # 3. Forzar la generación inicial del proyecto leyendo la carpeta estructurada
          python3 scripts/build_ipa_from_nsp.py game_folder/ --allow-other-metal || true
          
          # 4. PARCHE NUCLEAR: Limpiar el Scaler moderno de Xcode 27 en los archivos generados
          find . -type f \( -name "*.m" -o -name "*.h" -o -name "*.mm" -o -name "*.py" \) -exec sed -i '' -E 's/.*(colorContentOffsetX|colorContentOffsetY|MTL4FXTemporalScaler|MTL4FX).*/\/\/ Deshabilitado para Xcode 26.6/g' {} +
          
          # 5. Lanzar la compilación definitiva apuntando al directorio del juego
          python3 scripts/build_ipa_from_nsp.py game_folder/ --allow-other-metal
