name: Build iOS IPA From NSP

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'URL de descarga directa del juego (.nsp)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Latest Xcode Toolchain
        run: |
          # Buscar la versión más alta de Xcode en el servidor y activarla
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Activando entorno nativo: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip3 install lz4 "capstone>=5,<6" fonttools backports.zstd --break-system-packages
          brew install dotnet-sdk xcodegen glslang

      - name: Setup Keys
        run: |
          mkdir -p "$HOME/.config/nxnative"
          echo "${{ secrets.PROD_KEYS }}" > "$HOME/.config/nxnative/prod.keys"

      - name: Download and Build Game Nativelly
        run: |
          # 1. Crear la carpeta estructurada que pide el motor
          mkdir -p game_folder
          
          # 2. Descargar el juego de MediaFire directo a su directorio
          curl -L -o game_folder/game.nsp "${{ github.event.inputs.game_url }}"
          
          # 3. Lanzar la compilación nativa directa con Xcode 27 en la nube
          python3 scripts/build_ipa_from_nsp.py game_folder/ --allow-other-metal -k "$HOME/.config/nxnative/prod.keys"
